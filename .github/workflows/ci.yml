name: Java CI
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: ledgermatch_test
          POSTGRES_USER: test
          POSTGRES_PASSWORD: ci-test-only
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Test CSV import and export
        run: node --test tests/csv.test.mjs
      - name: Test against PostgreSQL
        run: ./mvnw -B verify
        env:
          TEST_DATABASE_URL: jdbc:postgresql://localhost:5432/ledgermatch_test
          TEST_DATABASE_USER: test
          TEST_DATABASE_PASSWORD: ci-test-only
